function Sparkline({color=G,width=420,height=60}){const pts=[0.8,0.65,0.7,0.5,0.55,0.4,0.45,0.3,0.2,0.15,0.05,0];const w=width,h=height,p=4;const coords=pts.map((y,i)=>[p+(i/(pts.length-1))*(w-p*2),p+y*(h-p*2)]);const path=coords.map((c,i)=>`${i===0?'M':'L'}${c[0]},${c[1]}`).join(' ');const fill=path+` L${coords[coords.length-1][0]},${h} L${coords[0][0]},${h} Z`;return <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.18"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><path d={fill} fill="url(#sg)"/><path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><circle cx={coords[coords.length-1][0]} cy={coords[coords.length-1][1]} r="3.5" fill={color}/></svg>;}

function CalendarModal({onClose,dark}){
  const d=dk(dark);
  const today=new Date();
  const [year,setYear]=React.useState(today.getFullYear());
  const [month,setMonth]=React.useState(today.getMonth());
  const [start,setStart]=React.useState(null);
  const [end,setEnd]=React.useState(null);
  const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const presets=[{l:'Сегодня',d:0},{l:'7 дней',d:7},{l:'30 дней',d:30},{l:'Этот месяц',d:-1}];
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const offset=(firstDay+6)%7;
  const cells=[];
  for(let i=0;i<offset;i++)cells.push(null);
  for(let i=1;i<=daysInMonth;i++)cells.push(i);
  const pickDay=(day)=>{if(!day)return;const dt=new Date(year,month,day);if(!start||end){setStart(dt);setEnd(null);}else{if(dt<start){setStart(dt);setEnd(null);}else{setEnd(dt);}}};
  const isIn=(day)=>{if(!day||!start||!end)return false;const dt=new Date(year,month,day);return dt>=start&&dt<=end;};
  const isStart=(day)=>{if(!day||!start)return false;const dt=new Date(year,month,day);return dt.toDateString()===start.toDateString();};
  const isEnd=(day)=>{if(!day||!end)return false;const dt=new Date(year,month,day);return dt.toDateString()===end.toDateString();};
  return <div className="modal-bg" onClick={onClose}><div className="modal-box" onClick={e=>e.stopPropagation()} style={{width:380}}>
    <div style={{fontSize:15,fontWeight:700,color:T.darkFg1,marginBottom:16}}>Выбор периода</div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
      {presets.map(p=><button key={p.l} onClick={()=>{const e=new Date();const s=new Date();if(p.d>0)s.setDate(s.getDate()-p.d);else if(p.d===0){setStart(e);setEnd(e);return;}else{s.setDate(1);}setStart(s);setEnd(e);}} style={{padding:'4px 12px',borderRadius:8,border:`1px solid rgba(255,255,255,0.1)`,background:'transparent',color:T.darkFg2,fontSize:12,fontWeight:600,cursor:'pointer'}}>{p.l}</button>)}
    </div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
      <button onClick={()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}} style={{background:'none',border:'none',color:T.darkFg2,cursor:'pointer',fontSize:18}}>‹</button>
      <span style={{fontSize:13,fontWeight:700,color:T.darkFg1}}>{months[month]} {year}</span>
      <button onClick={()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}} style={{background:'none',border:'none',color:T.darkFg2,cursor:'pointer',fontSize:18}}>›</button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:10}}>
      {['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:600,color:T.darkFg3,padding:'4px 0'}}>{d}</div>)}
      {cells.map((day,i)=><div key={i} onClick={()=>pickDay(day)} style={{textAlign:'center',padding:'6px 2px',fontSize:12,fontWeight:600,borderRadius:6,cursor:day?'pointer':'default',background:isStart(day)||isEnd(day)?G:isIn(day)?'rgba(33,156,70,0.15)':'transparent',color:isStart(day)||isEnd(day)?'#fff':day?T.darkFg1:'transparent'}}>{day||''}</div>)}
    </div>
    {start&&<div style={{fontSize:12,color:T.darkFg2,marginBottom:12}}>Период: {start.toLocaleDateString('ru-RU')} — {end?end.toLocaleDateString('ru-RU'):'...' }</div>}
    <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
      <Btn variant="secondary" size="sm" onClick={onClose}>Отмена</Btn>
      <Btn size="sm" onClick={onClose}>Применить</Btn>
    </div>
  </div></div>;
}

                  <button key={g.id} onClick={()=>setKpi(p=>({...p,goal:g.id}))}

          </div>}

          {/* Step 2: Brief */}
          {step===2&&<div>
            <div style={{fontSize:14,fontWeight:700,color:d.fg1,marginBottom:3}}>Бриф о бизнесе</div>

              {k:'notes',l:'Ограничения',h:'Стоп-слова, сезонность, запреты',p:'Не использовать «дёшево», сезон апр–сент',req:false},

                    style={{padding:'5px 12px',borderRadius:9999,border:`1px solid ${brief.geo===g?G:d.bord}`,background:brief.geo===g?'rgba(33,156,70,0.1)':'transparent',color:brief.geo===g?G:d.fg2,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                    {g}
                  </button>
                ))}
              </div>
            </div>
          </div>}

          {/* Step 3: Launch */}
          {step===3&&<div style={{textAlign:'center',padding:'16px 0'}}>
            <div style={{fontSize:36,marginBottom:10}}>🚀</div>
            <div style={{fontSize:17,fontWeight:800,color:d.fg1,marginBottom:6}}>{agentName} готов к запуску</div>
            <div style={{fontSize:12,color:d.fg2,marginBottom:18,lineHeight:1.7}}>
              Следит за <b style={{color:d.fg1}}>{selCount} аккаунт{selCount>1?'ами':''}</b> · CPA &lt; <b style={{color:d.fg1}}>{kpi.cpa} ₽</b> · CTR &gt; <b style={{color:d.fg1}}>{kpi.ctr}%</b> · ROMI &gt; <b style={{color:d.fg1}}>{kpi.romi}%</b><br/>
              Проверки каждые 6 часов
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:600,color:d.fg2,marginBottom:10}}>Режим работы</div>
              <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
                {[{id:'advisor',l:'Советник',d:'Только советует',e:'💬'},{id:'assistant',l:'Ассистент',d:'Вы подтверждаете',e:'⚡'},{id:'auto',l:'Автопилот',d:'Всё сам',e:'🤖'}].map(m=>(
                  <div key={m.id} onClick={()=>setMode(m.id)}
                    style={{width:130,padding:'12px 8px',borderRadius:10,border:`2px solid ${mode===m.id?G:d.bord}`,background:mode===m.id?'rgba(33,156,70,0.08)':'transparent',cursor:'pointer',textAlign:'center',transition:'all 150ms'}}>
                    <div style={{fontSize:20,marginBottom:3}}>{m.e}</div>
                    <div style={{fontSize:12,fontWeight:700,color:mode===m.id?G:d.fg1}}>{m.l}</div>
                    <div style={{fontSize:10,color:d.fg3,marginTop:2}}>{m.d}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>}
        </Card>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{display:'flex',gap:8}}>
            <Btn variant="secondary" onClick={()=>step>0?setStep(s=>s-1):onCancel&&onCancel()} style={{visibility:step===0&&!onCancel?'hidden':'visible'}}>← {step===0?'Отмена':'Назад'}</Btn>
          </div>
          <span style={{fontSize:11,color:d.fg3}}>{step+1} / {steps.length}</span>
          {step<3
            ?<Btn disabled={!canNext[step]} onClick={()=>setStep(s=>s+1)}>Далее →</Btn>
            :<Btn onClick={()=>onLaunch({name:agentName,mode,selAcc,kpi,brief})} style={{minWidth:150}}>
              <Ico size={12} color="#fff"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Ico>
              Запустить агента
            </Btn>}
        </div>
      </div>
    </div>
  );
}

              <div style={{fontSize:9,color:d.fg3}}>цель: {k.target}</div>

    <div style={{flex:1,overflow:'auto',padding:'12px 20px'}}>
      {/* ── ЛЕНТА ── */}
      {tab==='feed'&&<div style={{display:'flex',flexDirection:'column',gap:10}}>
        {actions.map(a=>{
          const isA=applied[a.id],isS=skipped[a.id],isExp=expandedId===a.id,isDone=isA||isS;
          return <Card key={a.id} dark={dark} style={{padding:'13px 15px',opacity:isDone?0.5:1,transition:'opacity 300ms',border:`1px solid ${isDone?d.bord:a.severity==='critical'?'rgba(239,68,68,0.3)':a.severity==='opportunity'?'rgba(33,156,70,0.25)':d.bord}`}}>

                  </span>
                </div>
                <div style={{fontSize:13,fontWeight:700,color:d.fg1,marginBottom:3}}>{a.title}</div>
                <div style={{fontSize:12,color:d.fg2,lineHeight:1.5,marginBottom:8}}>{a.reason}</div>

                </div>
                {a.keywords&&<div style={{marginBottom:8}}>
                  <button onClick={()=>setExpandedId(isExp?null:a.id)} style={{background:'none',border:'none',color:G,fontSize:11,fontWeight:600,cursor:'pointer',padding:0}}>
                    {isExp?'▲ Скрыть':'▼ Показать'} ключи ({a.keywords.length})
                  </button>
                  {isExp&&<div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:5}}>{a.keywords.map(kw=><span key={kw} style={{background:T.redL,color:T.redD,borderRadius:9999,padding:'2px 8px',fontSize:11,fontWeight:600}}>{kw}</span>)}</div>}
                </div>}
                {!isDone&&<div style={{display:'flex',gap:7,alignItems:'center'}}>
                  {agent.mode==='auto'
                    ?<span style={{fontSize:11,color:G,fontWeight:600}}>⚡ Автопилот применит в течение часа</span>
                    :<><Btn size="sm" onClick={()=>setApplied(p=>({...p,[a.id]:true}))}>
                      <Ico size={11} color="#fff"><polyline points="20 6 9 17 4 12"/></Ico>Применить
                    </Btn>
                    <Btn size="sm" variant="secondary" onClick={()=>setSkipped(p=>({...p,[a.id]:true}))}>Пропустить</Btn>
                    {agent.mode==='assistant'&&a.confidence>=90&&<span style={{fontSize:10,color:G}}>AI может сам ({a.confidence}%)</span>}
                    </>}
                </div>}
                {isA&&<div style={{color:GD,fontSize:11,fontWeight:600}}>✓ Применено · результат через 7 дней</div>}
                {isS&&<div style={{color:d.fg3,fontSize:11}}>Пропущено</div>}
              </div>
              <div style={{flexShrink:0,textAlign:'center'}}>
                <svg width="40" height="40" viewBox="0 0 40 40">
                  <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="4"/>
                  <circle cx="20" cy="20" r="16" fill="none" stroke={a.confidence>=80?G:a.confidence>=70?'#F59E0B':d.fg3} strokeWidth="4"
                    strokeDasharray={`${(a.confidence/100)*100.5} 100.5`} strokeLinecap="round" transform="rotate(-90 20 20)"/>
                  <text x="20" y="24" textAnchor="middle" fontSize="10" fontWeight="700" fill={d.fg1} fontFamily="Montserrat,sans-serif">{a.confidence}%</text>
                </svg>
                <div style={{fontSize:8,color:d.fg3}}>уверен.</div>
              </div>
            </div>
          </Card>;
        })}
        {pending===0&&<div style={{textAlign:'center',padding:'40px 0',color:d.fg3}}>
          <div style={{fontSize:32,marginBottom:8}}>✓</div>
          <div style={{fontSize:14,fontWeight:600,color:d.fg2}}>Всё под контролем</div>
          <div style={{fontSize:12,marginTop:4}}>Следующая проверка через 4 часа</div>
        </div>}
      </div>}

      {/* ── ПАМЯТЬ ── */}
      {tab==='memory'&&<div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:14}}>
          {[{l:'Применено',v:'24',s:'за 90 дней'},{l:'Успешных',v:'21',s:'87% эффективность'},{l:'Эффект',v:'+112 000 ₽',s:'подтверждённый'}].map(s=>(
            <Card key={s.l} dark={dark} style={{padding:'12px 14px'}}>
              <div style={{fontSize:9,color:d.fg3,textTransform:'uppercase',letterSpacing:'0.05em',fontWeight:600}}>{s.l}</div>
              <div style={{fontSize:19,fontWeight:800,color:s.v.includes('+')?GD:d.fg1,marginTop:3}}>{s.v}</div>
              <div style={{fontSize:10,color:d.fg3,marginTop:1}}>{s.s}</div>
            </Card>
          ))}
        </div>
        <Card dark={dark} style={{overflow:'hidden'}}>
          {memory.map((m,i)=>(
            <div key={i} style={{display:'grid',gridTemplateColumns:'60px 1fr 1fr auto',gap:10,alignItems:'center',padding:'11px 16px',borderBottom:i<memory.length-1?`1px solid ${d.bord}`:''}}>
              <div style={{fontSize:10,color:d.fg3,fontWeight:600}}>{m.date}</div>
              <div><div style={{fontSize:12,fontWeight:600,color:d.fg1}}>{m.action}</div><div style={{fontSize:10,color:d.fg3}}>{m.account}</div></div>
              <div style={{fontSize:11,color:d.fg2}}>{m.result}</div>
              <span style={{background:m.status==='success'?GL:'#FEF3C7',color:m.status==='success'?GD:'#B45309',borderRadius:9999,padding:'2px 8px',fontSize:11,fontWeight:700}}>{m.delta}</span>
            </div>
          ))}
        </Card>
      </div>}

      {/* ── KPI ── */}
      {tab==='kpi'&&<div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div style={{fontSize:12,color:d.fg2}}>Целевые метрики · агент бьёт тревогу при отклонении</div>
          <Btn size="sm">Сохранить</Btn>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
          {[{k:'cpa',l:'Целевой CPA',s:'₽'},{k:'ctr',l:'Мин. CTR',s:'%'},{k:'romi',l:'Мин. ROMI',s:'%'},{k:'budget',l:'Бюджет/мес',s:'₽'}].map(f=>(
            <Card key={f.k} dark={dark} style={{padding:'12px 14px'}}>
              <div style={{fontSize:11,fontWeight:600,color:d.fg1,marginBottom:6}}>{f.l}</div>
              <div style={{position:'relative'}}>
                <input defaultValue={kpi[f.k]}
                  style={{width:'100%',height:38,borderRadius:7,border:`1px solid ${d.bord}`,background:'rgba(255,255,255,0.04)',padding:`0 ${f.s.length>1?36:24}px 0 10px`,fontSize:16,fontWeight:700,color:G,outline:'none'}}/>
                <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',fontSize:12,color:d.fg3}}>{f.s}</span>
              </div>
            </Card>
          ))}
        </div>
        <Card dark={dark} style={{padding:14}}>
          <div style={{fontSize:12,fontWeight:700,color:d.fg1,marginBottom:10}}>Аккаунты этого агента</div>
          {agentAccounts.map(a=>(
            <div key={a.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:`1px solid ${d.bord}`}}>
              <img src={IMG_YADIRECT} style={{width:24,height:24,borderRadius:6,mixBlendMode:'screen'}}/>
              <div style={{flex:1,fontSize:12,fontWeight:600,color:d.fg1}}>{a.name}</div>
              <span style={{fontSize:10,color:d.fg3}}>{'Яндекс Директ'}</span>
            </div>
          ))}
        </Card>
      </div>}
    </div>
  </div>;
}

        </div>
      </div>
    </Card>

      {projects.map(p=><Card key={p.name} dark={dark} style={{padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>

    </div>:<div style={{textAlign:'center',padding:'40px 0',color:d.fg3,fontSize:13}}>Подключите аккаунт VK Ads для управления проектами</div>}
  </div>;
}

function CampaignBriefModal({dark,platform,onClose,onCreateCampaign}){

        <div>
          <div style={{fontSize:15,fontWeight:700,color:T.darkFg1}}>
            Новая кампания · {platform==='yandex'?'Яндекс Директ':'ВК Реклама'}

          <div style={{fontSize:11,color:T.darkFg3}}>AI создаст структуру, ключи и объявления</div>
        </div>
        <button onClick={onClose} style={{marginLeft:'auto',background:'none',border:'none',color:T.darkFg3,cursor:'pointer',fontSize:20,lineHeight:1}}>×</button>
      </div>

      {/* Step tabs */}
      <div style={{display:'flex',gap:0,marginBottom:20,borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
        {steps.map((s,i)=>(
          <button key={s.id} onClick={()=>i<step&&setStep(i)} style={{padding:'7px 14px',border:'none',fontFamily:'inherit',fontSize:12,fontWeight:step===i?700:500,color:step===i?G:i<step?T.darkFg2:T.darkFg3,background:'transparent',borderBottom:`2px solid ${step===i?G:'transparent'}`,cursor:i<step?'pointer':'default',marginBottom:-1}}>
            {i<step?'✓ ':''}{s.title}
          </button>
        ))}

      {/* Fields */}
      <div style={{display:'flex',flexDirection:'column',gap:14}}>

            {(f.type==='text')&&
              <input value={data[f.k]||''} onChange={e=>set(f.k,e.target.value)} placeholder={f.ph} style={{...inputStyle,height:38}}/>}

            {f.type==='money'&&

            🚀 Создать кампанию
          </button>}
      </div>
    </div>
  </div>;
}


// ── Shared brief helpers (defined OUTSIDE brief components to prevent focus loss) ──
function BriefInput({value, onChange, placeholder, suffix, type='text'}){
  const style={width:'100%',height:38,borderRadius:8,border:'1px solid rgba(255,255,255,0.1)',background:'rgba(255,255,255,0.04)',padding:suffix?'0 32px 0 12px':'0 12px',fontSize:13,color:'#F1F5F9',outline:'none',fontFamily:'Montserrat,sans-serif'};
  return <div style={{position:'relative'}}>
    <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={style}/>
    {suffix&&<span style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',fontSize:12,color:'#64748B'}}>{suffix}</span>}
  </div>;
}
function BriefTextarea({value, onChange, placeholder, minHeight=56}){
  const style={width:'100%',minHeight,borderRadius:8,border:'1px solid rgba(255,255,255,0.1)',background:'rgba(255,255,255,0.04)',padding:'10px 12px',fontSize:13,color:'#F1F5F9',outline:'none',resize:'vertical',fontFamily:'Montserrat,sans-serif'};
  return <textarea value={value} onChange={onChange} placeholder={placeholder} style={style}/>;
}
function BriefSelect({value, onChange, children}){
  const style={width:'100%',height:38,borderRadius:8,border:'1px solid rgba(255,255,255,0.1)',background:'rgba(30,32,50,0.95)',padding:'0 12px',fontSize:13,color:'#F1F5F9',outline:'none',fontFamily:'Montserrat,sans-serif',cursor:'pointer'};
  return <select value={value} onChange={onChange} style={style}>{children}</select>;
}
function BriefLabel({children,hint,req}){
  return <div style={{fontSize:12,fontWeight:600,color:'#F1F5F9',marginBottom:4,display:'flex',gap:5,alignItems:'center',flexWrap:'wrap'}}>
    {children}
    {req&&<span style={{fontSize:10,background:'rgba(239,68,68,0.12)',color:'#F87171',padding:'1px 5px',borderRadius:3}}>обязательно</span>}
    {hint&&<span style={{fontSize:10,color:'#64748B',fontWeight:400}}>— {hint}</span>}
  </div>;
}
function BriefChip({val,cur,onClick,children}){
  const active=cur===val;
  return <button onClick={()=>onClick(val)} style={{padding:'5px 12px',borderRadius:9999,border:`1px solid ${active?'#219c46':'rgba(255,255,255,0.1)'}`,background:active?'rgba(33,156,70,0.12)':'transparent',color:active?'#219c46':'#94A3B8',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Montserrat,sans-serif'}}>{children}</button>;
}

      <Row label="Тёмная тема" desc="Текущая цветовая схема"><Toggle on={dark} onToggle={()=>onDark(!dark)}/></Row>
      <div style={{padding:'14px 18px'}}>
        <div style={{fontSize:13,fontWeight:600,color:d.fg1,marginBottom:10}}>Тариф</div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {['free','pro','agency'].map(p=><button key={p} onClick={()=>setShowPricing(true)} style={{height:34,padding:'0 18px',borderRadius:8,border:`2px solid ${plan===p?G:'rgba(255,255,255,0.1)'}`,background:plan===p?'rgba(33,156,70,0.12)':'transparent',color:plan===p?G:d.fg2,fontFamily:'inherit',fontSize:12,fontWeight:700,cursor:'pointer',textTransform:'uppercase'}}>{p}</button>)}
          <button onClick={()=>setShowPricing(true)} style={{fontSize:12,color:G,background:'none',border:'none',cursor:'pointer',fontWeight:600}}>Изменить тариф ↗</button>
        </div>
      </div>
    </Section>
    <Section title="Токены">
      <div style={{padding:'14px 18px'}}>
        <TokenBar dark={dark} used={415} limit={TOKEN_PLANS[plan].limit}/>
        <div style={{marginTop:10,fontSize:12,color:d.fg2,lineHeight:1.6}}>На тарифе {TOKEN_PLANS[plan].label}: {TOKEN_PLANS[plan].limit.toLocaleString('ru-RU')} токенов до 30 июня 2026. Цена: {TOKEN_PLANS[plan].price}{TOKEN_PLANS[plan].period}. Уведомление появляется на 80%, при 100% генерации и аудиты останавливаются до пополнения или нового периода.</div>
        <div style={{display:'flex',gap:8,marginTop:12}}>
          <Btn size="sm" onClick={()=>setShowPricing(true)}>Изменить тариф</Btn>
          <Btn size="sm" variant="secondary" onClick={()=>setShowBuyTokens(true)}>Докупить токены</Btn>
        </div>
      </div>
    </Section>
    <Section title="Профиль">
      <Row label="Имя" desc="Иван Петров"><Btn size="sm" variant="secondary">Изменить</Btn></Row>
      <Row label="Email" desc="ivan@example.com"><Btn size="sm" variant="secondary">Изменить</Btn></Row>
      <Row label="Пароль" last><Btn size="sm" variant="secondary">Сменить пароль</Btn></Row>
    </Section>
    <Section title="Уведомления">
      <Row label="Email-уведомления" desc="Отчёты и алерты на почту"><Toggle on={emailEnabled} onToggle={()=>setEmailEnabled(!emailEnabled)}/></Row>
      <Row label="Push-уведомления" desc="Уведомления в браузере"><Toggle on={pushEnabled} onToggle={()=>setPushEnabled(!pushEnabled)}/></Row>
      <Row label="Telegram чат-бот" desc="Алерты и отчёты в @dozim_ai_bot">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {tgEnabled&&<span style={{fontSize:11,color:G,fontWeight:600}}>@dozim_ai_bot</span>}
          <Toggle on={tgEnabled} onToggle={()=>setTgEnabled(!tgEnabled)}/>
        </div>
      </Row>
      <Row label="Чат-бот Макс" desc="Уведомления через Макс (VK)" last>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {maxEnabled&&<span style={{fontSize:11,color:G,fontWeight:600}}>Подключён</span>}
          <Toggle on={maxEnabled} onToggle={()=>setMaxEnabled(!maxEnabled)}/>
        </div>
      </Row>
    </Section>
    {tgEnabled&&<Card dark={dark} style={{padding:'14px 18px',marginBottom:20,background:'rgba(41,160,216,0.08)',border:'1px solid rgba(41,160,216,0.2)'}}>
      <div style={{fontSize:13,fontWeight:600,color:'#29A0D8',marginBottom:4}}>Telegram подключён</div>
      <div style={{fontSize:12,color:d.fg2}}>Найдите <strong>@dozim_ai_bot</strong> в Telegram и нажмите /start. Вы будете получать ежедневные отчёты и алерты о превышении KPI.</div>
    </Card>}
    {maxEnabled&&<Card dark={dark} style={{padding:'14px 18px',marginBottom:20,background:'rgba(0,119,255,0.08)',border:'1px solid rgba(0,119,255,0.2)'}}>
      <div style={{fontSize:13,fontWeight:600,color:'#0077FF',marginBottom:4}}>Макс подключён</div>
      <div style={{fontSize:12,color:d.fg2}}>Уведомления будут приходить в чат-бот Макс (VK). Откройте VK и найдите официального бота ДОЖИМ-АЙ.</div>
    </Card>}
    <Section title="Опасная зона">
      <div style={{padding:'14px 18px'}}><Btn variant="danger">Удалить аккаунт</Btn></div>
    </Section>
  </div>;
}

// ── ЦЕНТР ПОМОЩИ ──────────────────────────────────────────────
function HelpPage({dark}){
  const d=dk(dark);
  const sections=[{title:'Поддержка',items:[{icon:<Ico size={18} color={G}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></Ico>,label:'База знаний',desc:'Статьи и гайды',action:'Открыть'},{icon:<img src="https://static.vecteezy.com/system/resources/previews/070/119/582/large_2x/vk-logo-circle-outline-icon-on-transparent-background-free-png.png" style={{width:18,height:18,objectFit:'contain'}}/>,label:'Чат-бот VK',desc:'vk.com/dozim_ai',action:'Написать'},{icon:<Ico size={18} color="#29A0D8"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></Ico>,label:'Чат-бот Telegram',desc:'@dozim_ai_bot',action:'Написать'},{icon:<Ico size={18} color={G}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></Ico>,label:'Почта',desc:'support@dozim.ai',action:'Написать'}]},{title:'Юридическая информация',items:['Ограничение ответственности за AI','Политика обработки персональных данных','Политика оплаты и подписки','Политика использования cookies','Пользовательское соглашение','Согласие на обработку данных'].map(label=>({icon:<Ico size={16} color={d.fg3}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></Ico>,label,desc:''}))}];
  return <div style={{flex:1,overflow:'auto',padding:20,background:d.bg}}>
    <h1 style={{fontSize:20,fontWeight:700,color:d.fg1,marginBottom:20}}>Центр помощи</h1>
    {sections.map(sec=><div key={sec.title} style={{marginBottom:24}}><div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:d.fg3,marginBottom:12}}>{sec.title}</div><Card dark={dark} style={{overflow:'hidden'}}>{sec.items.map((item,i)=><div key={i} className="row-h" style={{display:'flex',alignItems:'center',gap:14,padding:'14px 18px',borderBottom:i<sec.items.length-1?`1px solid ${d.bord}`:'',cursor:'pointer'}}><div style={{flexShrink:0}}>{item.icon}</div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:d.fg1}}>{item.label}</div>{item.desc&&<div style={{fontSize:12,color:d.fg2,marginTop:1}}>{item.desc}</div>}</div>{item.action?<Btn size="sm" variant="secondary">{item.action}</Btn>:<Ico size={14} color={d.fg3}><polyline points="9 18 15 12 9 6"/></Ico>}</div>)}</Card></div>)}
  </div>;
}

// ── APP ───────────────────────────────────────────────────────
function App(){
  const [active,setActive]=React.useState('home');
  const [dark,setDark]=React.useState(true);
  const [plan,setPlan]=React.useState('free');
  const [showCal,setShowCal]=React.useState(false);
  const [showBuyTokens,setShowBuyTokens]=React.useState(false);
  const [tokenPopup,setTokenPopup]=React.useState('warning');
  const [scrollProblems,setScrollProblems]=React.useState(0);
  // Lift agent state so it persists across navigation
  const [agents,setAgents]=React.useState([]); // [{id,name,launched,mode,selAccounts,kpi,brief}]
  const [activeAgentId,setActiveAgentId]=React.useState(null);
  const [showBrief,setShowBrief]=React.useState(false); // trigger new brief
  // Simulate account connections (in real app from YandexPage/VKPage state)
  const [ydConnected,setYdConnected]=React.useState(false);
  const tokenLimit=TOKEN_PLANS[plan].limit;
  const tokenUsed=TOKEN_USED[plan]||0;
  const nav=p=>setActive(p);
  const handleNotif=()=>setTokenPopup('limit');
  const openTokenPopup=()=>setTokenPopup(tokenUsed>=tokenLimit?'limit':'warning');
  const d=dk(dark);
  const pageMap={
    home:<HomePage dark={dark} scrollToProblems={scrollProblems} ydConnected={ydConnected} agents={agents} onNav={nav}/>,
    analyst:<AnalystPage dark={dark} agents={agents} setAgents={setAgents} activeAgentId={activeAgentId} setActiveAgentId={setActiveAgentId} showBrief={showBrief} setShowBrief={setShowBrief} ydConnected={ydConnected} onNavYD={()=>nav('yandex')}/>,
    yandex:<YandexPage dark={dark} plan={plan} onConnect={setYdConnected}/>,
    campaigns:<CampaignsPage dark={dark} plan={plan} ydConnected={ydConnected}/>,
    analytics:<AnalyticsPage dark={dark}/>,
    competitors:<CompetitorRadarPage dark={dark}/>,
    images:<ImageGenerationPage dark={dark}/>,
    opps:<OppsPage dark={dark}/>,
    referral:<ReferralPage dark={dark} plan={plan}/>,
    settings:<SettingsPage dark={dark} onDark={setDark} plan={plan} onPlan={setPlan}/>,
    help:<HelpPage dark={dark}/>,
  };
  return <div style={{display:'flex',height:'100vh',overflow:'hidden',background:d.bg}}>
    {showCal&&<CalendarModal onClose={()=>setShowCal(false)} dark={dark}/>}
    {showBuyTokens&&<BuyTokensModal dark={dark} onClose={()=>setShowBuyTokens(false)}/>}
    {tokenPopup&&<TokenLimitPopup dark={dark} type={tokenPopup} used={tokenPopup==='limit'?tokenLimit:tokenUsed} limit={tokenLimit} onClose={()=>setTokenPopup(null)} onBuy={()=>{setTokenPopup(null);setShowBuyTokens(true);}} onReferral={()=>{setTokenPopup(null);setActive('referral');}}/>}
    <Sidebar active={active} onNav={nav} dark={dark} plan={plan}/>
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <TopBar dark={dark} onCalendar={()=>setShowCal(true)} onNotif={handleNotif} plan={plan} tokenUsed={tokenUsed} tokenLimit={tokenLimit} onTokenClick={openTokenPopup}/>
      {pageMap[active]||<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:d.fg3}}>Раздел в разработке</div>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
