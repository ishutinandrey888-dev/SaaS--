const G='#219c46',GH='#1a7d38',GL='#E8F5EC',GM='#C8E6D0',GD='#1a7d38',GXL='#F0FAF3';
const T={green:G,greenH:GH,greenL:GL,greenM:GM,greenD:GD,greenXL:GXL,red:'#EF4444',redD:'#DC2626',redL:'#FEE2E2',bg:'#F4F6FA',surface:'#FFFFFF',border:'#E8ECF2',fg1:'#0F172A',fg2:'#475569',fg3:'#94A3B8',sl100:'#F1F5F9',sl200:'#E2E8F0',darkBg:'#1A1D2E',darkSurf:'#232638',darkSurf2:'#2A2E45',darkBorder:'rgba(255,255,255,0.07)',darkFg1:'#F1F5F9',darkFg2:'#94A3B8',darkFg3:'#64748B'};

function dk(dark){return{bg:dark?T.darkBg:T.bg,card:dark?T.darkSurf:T.surface,bord:dark?T.darkBorder:T.border,fg1:dark?T.darkFg1:T.fg1,fg2:dark?T.darkFg2:T.fg2,fg3:dark?T.darkFg3:T.fg3};}

function Card({dark,style={},children,onClick}){const d=dk(dark);return <div onClick={onClick} style={{background:d.card,borderRadius:14,border:`1px solid ${d.bord}`,boxShadow:dark?'none':'0 4px 16px rgba(15,23,42,0.07)',...style}}>{children}</div>;}

function Btn({onClick,variant='primary',size='md',disabled,full,children,style={}}){
  const h=size==='lg'?44:size==='sm'?30:36,px=size==='lg'?22:size==='sm'?12:16,fs=size==='lg'?14:size==='sm'?11:13;
  const vMap={primary:{background:G,color:'#fff',border:'none'},secondary:{background:'rgba(255,255,255,0.06)',color:T.darkFg1,border:`1px solid rgba(255,255,255,0.1)`},ghost:{background:'transparent',color:G,border:'none'},vk:{background:'#0077FF',color:'#fff',border:'none'},yandex:{background:'#FC3F1D',color:'#fff',border:'none'},danger:{background:T.redL,color:T.redD,border:`1px solid #FCA5A5`},light:{background:'#fff',color:T.fg1,border:`1px solid ${T.sl200}`}};
  return <button disabled={disabled} onClick={onClick} className="btn-h" style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,height:h,padding:`0 ${px}px`,borderRadius:9,fontFamily:'inherit',fontSize:fs,fontWeight:600,cursor:disabled?'default':'pointer',opacity:disabled?0.45:1,width:full?'100%':undefined,transition:'filter 150ms,opacity 150ms',...vMap[variant],...style}}>{children}</button>;
}

function Ico({children,size=15,color='currentColor'}){return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;}

function Sparkline({color=G,width=420,height=60}){const pts=[0.8,0.65,0.7,0.5,0.55,0.4,0.45,0.3,0.2,0.15,0.05,0];const w=width,h=height,p=4;const coords=pts.map((y,i)=>[p+(i/(pts.length-1))*(w-p*2),p+y*(h-p*2)]);const path=coords.map((c,i)=>`${i===0?'M':'L'}${c[0]},${c[1]}`).join(' ');const fill=path+` L${coords[coords.length-1][0]},${h} L${coords[0][0]},${h} Z`;return <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.18"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><path d={fill} fill="url(#sg)"/><path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><circle cx={coords[coords.length-1][0]} cy={coords[coords.length-1][1]} r="3.5" fill={color}/></svg>;}

function Trend({pct,positive=true}){const up=positive?pct>0:pct<0;return <span style={{display:'inline-flex',alignItems:'center',gap:2,background:up?GM:T.redL,color:up?GD:T.redD,borderRadius:9999,padding:'2px 7px',fontSize:11,fontWeight:700}}>{pct>0?'↑':'↓'} {Math.abs(pct)}%</span>;}

function StatusBadge({connected}){return <span style={{display:'inline-flex',alignItems:'center',gap:5,background:connected?GL:'rgba(255,255,255,0.06)',color:connected?GD:T.darkFg2,borderRadius:9999,padding:'3px 10px',fontSize:11,fontWeight:600}}><span style={{width:6,height:6,borderRadius:'50%',background:connected?G:T.darkFg3,display:'inline-block'}}/>{connected?'Подключён':'Не подключён'}</span>;}

// ── Calendar Modal ────────────────────────────────────────────
function CalendarModal({onClose,dark}){
  const d=dk(dark);
  const today=new Date();
  const [year,setYear]=React.useState(today.getFullYear());
  const [month,setMonth]=React.useState(today.getMonth());
  const [start,setStart]=React.useState(null);
  const [end,setEnd]=React.useState(null);
  const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const presets=[{l:'Сегодня',d:0},{l:'7 дней',d:7},{l:'30 дней',d:30},{l:'Этот месяц',d:-1}];
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const offset=(firstDay+6)%7;
  const cells=[];
  for(let i=0;i<offset;i++)cells.push(null);
  for(let i=1;i<=daysInMonth;i++)cells.push(i);
  const pickDay=(day)=>{if(!day)return;const dt=new Date(year,month,day);if(!start||end){setStart(dt);setEnd(null);}else{if(dt<start){setStart(dt);setEnd(null);}else{setEnd(dt);}}};
  const isIn=(day)=>{if(!day||!start||!end)return false;const dt=new Date(year,month,day);return dt>=start&&dt<=end;};
  const isStart=(day)=>{if(!day||!start)return false;const dt=new Date(year,month,day);return dt.toDateString()===start.toDateString();};
  const isEnd=(day)=>{if(!day||!end)return false;const dt=new Date(year,month,day);return dt.toDateString()===end.toDateString();};
  return <div className="modal-bg" onClick={onClose}><div className="modal-box" onClick={e=>e.stopPropagation()} style={{width:380}}>
    <div style={{fontSize:15,fontWeight:700,color:T.darkFg1,marginBottom:16}}>Выбор периода</div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
      {presets.map(p=><button key={p.l} onClick={()=>{const e=new Date();const s=new Date();if(p.d>0)s.setDate(s.getDate()-p.d);else if(p.d===0){setStart(e);setEnd(e);return;}else{s.setDate(1);}setStart(s);setEnd(e);}} style={{padding:'4px 12px',borderRadius:8,border:`1px solid rgba(255,255,255,0.1)`,background:'transparent',color:T.darkFg2,fontSize:12,fontWeight:600,cursor:'pointer'}}>{p.l}</button>)}
    </div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
      <button onClick={()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}} style={{background:'none',border:'none',color:T.darkFg2,cursor:'pointer',fontSize:18}}>‹</button>
      <span style={{fontSize:13,fontWeight:700,color:T.darkFg1}}>{months[month]} {year}</span>
      <button onClick={()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}} style={{background:'none',border:'none',color:T.darkFg2,cursor:'pointer',fontSize:18}}>›</button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:10}}>
      {['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:600,color:T.darkFg3,padding:'4px 0'}}>{d}</div>)}
      {cells.map((day,i)=><div key={i} onClick={()=>pickDay(day)} style={{textAlign:'center',padding:'6px 2px',fontSize:12,fontWeight:600,borderRadius:6,cursor:day?'pointer':'default',background:isStart(day)||isEnd(day)?G:isIn(day)?'rgba(33,156,70,0.15)':'transparent',color:isStart(day)||isEnd(day)?'#fff':day?T.darkFg1:'transparent'}}>{day||''}</div>)}
    </div>
    {start&&<div style={{fontSize:12,color:T.darkFg2,marginBottom:12}}>Период: {start.toLocaleDateString('ru-RU')} — {end?end.toLocaleDateString('ru-RU'):'...' }</div>}
    <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
      <Btn variant="secondary" size="sm" onClick={onClose}>Отмена</Btn>
      <Btn size="sm" onClick={onClose}>Применить</Btn>
    </div>
  </div></div>;
}

// ── ADMIN: ПОЛЬЗОВАТЕЛИ ───────────────────────────────────────
function AdminUsers({dark}){
  const d=dk(dark);
  const [planFilter,setPlanFilter]=React.useState('all');
  const [statusFilter,setStatusFilter]=React.useState('all');
  const [search,setSearch]=React.useState('');
  const [selected,setSelected]=React.useState(new Set());
  const filtered=ADMIN_USERS.filter(u=>{
    if(planFilter!=='all'&&u.plan!==planFilter)return false;
    if(statusFilter!=='all'&&u.status!==statusFilter)return false;
    if(search&&!(u.name.toLowerCase().includes(search.toLowerCase())||u.email.toLowerCase().includes(search.toLowerCase())))return false;
    return true;
  });
  const toggle=id=>{const n=new Set(selected);n.has(id)?n.delete(id):n.add(id);setSelected(n);};
  const allSel=filtered.length>0&&filtered.every(u=>selected.has(u.id));
  const toggleAll=()=>{if(allSel)setSelected(new Set());else setSelected(new Set(filtered.map(u=>u.id)));};
  const statusBadge={active:{l:'Активен',c:G,bg:GL},expiring:{l:'Истекает',c:'#D97706',bg:'#FEF3C7'},expired:{l:'Истёк',c:T.redD,bg:T.redL},trial:{l:'Триал',c:'#3B82F6',bg:'#DBEAFE'}};
  const sendNotif=(u)=>{location.hash=`#/admin/broadcast?user=${u.id}`;};
  return <div style={{flex:1,overflow:'auto',padding:20,background:d.bg}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
      <div>
        <h1 style={{fontSize:22,fontWeight:800,color:d.fg1}}>Пользователи</h1>
        <p style={{fontSize:12,color:d.fg2,marginTop:2}}>{filtered.length} из {ADMIN_USERS.length} · выбрано: {selected.size}</p>
      </div>
      <div style={{display:'flex',gap:8}}>
        {selected.size>0&&<Btn size="sm" onClick={()=>{location.hash='#/admin/broadcast?ids='+[...selected].join(',');}}><Ico size={12} color="#fff"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></Ico>Уведомить выбранных ({selected.size})</Btn>}
        <Btn size="sm" variant="secondary"><Ico size={12} color={T.darkFg1}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Ico>Экспорт CSV</Btn>
      </div>
    </div>
    <Card dark={dark} style={{padding:14,marginBottom:14,display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
      <div style={{position:'relative',flex:'1 1 220px'}}>
        <Ico size={13} color={d.fg3}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Ico>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Email или имя..." style={{width:'100%',background:'rgba(255,255,255,0.04)',border:`1px solid ${d.bord}`,borderRadius:8,padding:'8px 10px 8px 30px',color:d.fg1,fontSize:12,outline:'none'}}/>
        <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}><Ico size={13} color={d.fg3}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Ico></span>
      </div>
      <select value={planFilter} onChange={e=>setPlanFilter(e.target.value)} style={{background:'rgba(255,255,255,0.04)',border:`1px solid ${d.bord}`,borderRadius:8,padding:'8px 10px',color:d.fg1,fontSize:12,outline:'none'}}>
        <option value="all">Все тарифы</option><option value="free">Free</option><option value="pro">Pro</option><option value="agency">Agency</option>
      </select>
      <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{background:'rgba(255,255,255,0.04)',border:`1px solid ${d.bord}`,borderRadius:8,padding:'8px 10px',color:d.fg1,fontSize:12,outline:'none'}}>
        <option value="all">Все статусы</option><option value="active">Активен</option><option value="expiring">Истекает</option><option value="expired">Истёк</option><option value="trial">Триал</option>
      </select>
    </Card>
    <Card dark={dark} style={{overflow:'hidden'}}>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead>
            <tr style={{background:'rgba(255,255,255,0.03)',color:d.fg3,textAlign:'left'}}>
              <th style={{padding:'12px 14px',width:36}}><input type="checkbox" checked={allSel} onChange={toggleAll}/></th>
              <th style={{padding:'12px 14px',fontWeight:600}}>Пользователь</th>
              <th style={{padding:'12px 14px',fontWeight:600}}>Тариф</th>

            </tr>
          </thead>
          <tbody>

              const sb=statusBadge[u.status]||statusBadge.active;
              return <tr key={u.id} style={{borderTop:`1px solid ${d.bord}`}}>
                <td style={{padding:'12px 14px'}}><input type="checkbox" checked={selected.has(u.id)} onChange={()=>toggle(u.id)}/></td>
                <td style={{padding:'12px 14px'}}>
                  <div style={{fontWeight:600,color:d.fg1}}>{u.name}</div>
                  <div style={{fontSize:11,color:d.fg3}}>{u.email}</div>
                </td>
                <td style={{padding:'12px 14px'}}><span style={{fontSize:10,fontWeight:700,color:PLAN_INFO[u.plan].color,background:'rgba(255,255,255,0.04)',padding:'3px 8px',borderRadius:9999,letterSpacing:'0.06em'}}>{PLAN_INFO[u.plan].label}</span></td>
                <td style={{padding:'12px 14px',minWidth:120}}>
                  <div style={{fontSize:11,color:(u.tokensUsed/PLAN_INFO[u.plan].tokens)>=1?T.redD:(u.tokensUsed/PLAN_INFO[u.plan].tokens)>=0.8?'#F59E0B':d.fg2,fontWeight:700}}>{u.tokensUsed.toLocaleString('ru-RU')} / {PLAN_INFO[u.plan].tokens.toLocaleString('ru-RU')}</div>
                  <div style={{height:5,background:'rgba(255,255,255,0.06)',borderRadius:9999,overflow:'hidden',marginTop:4}}><div style={{height:'100%',width:Math.min(100,Math.round(u.tokensUsed/PLAN_INFO[u.plan].tokens*100))+'%',background:(u.tokensUsed/PLAN_INFO[u.plan].tokens)>=1?T.redD:(u.tokensUsed/PLAN_INFO[u.plan].tokens)>=0.8?'#F59E0B':G}}/></div>
                </td>
                <td style={{padding:'12px 14px'}}><span style={{fontSize:10,fontWeight:600,color:sb.c,background:sb.bg,padding:'3px 8px',borderRadius:9999}}>{sb.l}</span></td>
                <td style={{padding:'12px 14px',color:d.fg2}}>
                  <div>{SOURCE_LABELS[u.source]||u.source}</div>
                  {u.campaign!=='-'&&<div style={{fontSize:10,color:d.fg3}}>utm: {u.campaign}</div>}
                </td>
                <td style={{padding:'12px 14px',color:d.fg2}}>{u.regDate}</td>
                <td style={{padding:'12px 14px',color:u.status==='expiring'?'#D97706':u.status==='expired'?T.redD:d.fg2,fontWeight:u.status==='expiring'||u.status==='expired'?700:400}}>{u.expires}</td>
                <td style={{padding:'12px 14px',textAlign:'right',whiteSpace:'nowrap'}}>
                  <button onClick={()=>sendNotif(u)} title="Отправить уведомление в чат-бот" style={{background:'transparent',border:`1px solid ${d.bord}`,borderRadius:7,padding:'5px 9px',cursor:'pointer',color:d.fg2,fontSize:11,fontFamily:'inherit',marginRight:4}}>📤 Уведомить</button>
                  <button title="Подробнее" style={{background:'transparent',border:`1px solid ${d.bord}`,borderRadius:7,padding:'5px 9px',cursor:'pointer',color:d.fg2,fontSize:11,fontFamily:'inherit'}}>⋯</button>
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </Card>
  </div>;
}

function AdminSources({dark,channels}){

  const userBySource={};
  ADMIN_USERS.forEach(u=>{

    if(u.mrr>0){userBySource[k].paying++;userBySource[k].revenue+=u.mrr;}

  const baseRows=Object.values(userBySource);
  const channelRows=channels.filter(c=>!baseRows.some(r=>r.source===c.source&&r.campaign===c.campaign)).map(c=>({source:c.source,campaign:c.campaign,users:0,paying:0,revenue:0,fromUtm:true,clicks:c.clicks||0}));

                </td>

                <td style={{padding:'12px 14px',textAlign:'right',color:d.fg2}}>{clicks.toLocaleString('ru-RU')}</td>

function AdminUTM({dark,channels,setChannels}){
  const d=dk(dark);
  const [form,setForm]=React.useState({url:'https://dozim.ai/',source:'yandex',medium:'cpc',campaign:'',content:'',term:''});
  const [copied,setCopied]=React.useState(null);
  const buildUrl=(f)=>{
    const params=[];
    if(f.source)params.push(`utm_source=${encodeURIComponent(f.source)}`);
    if(f.medium)params.push(`utm_medium=${encodeURIComponent(f.medium)}`);
    if(f.campaign)params.push(`utm_campaign=${encodeURIComponent(f.campaign)}`);
    if(f.content)params.push(`utm_content=${encodeURIComponent(f.content)}`);
    if(f.term)params.push(`utm_term=${encodeURIComponent(f.term)}`);
    return f.url+(f.url.includes('?')?'&':'?')+params.join('&');
  };
  const fullUrl=buildUrl(form);
  const create=()=>{
    if(!form.campaign){alert('Заполните utm_campaign');return;}
    const slug=Math.random().toString(36).slice(2,8);
    const newChannel={id:Date.now(),...form,fullUrl,short:`dozim.ai/r/${slug}`,createdAt:new Date().toISOString().slice(0,10),clicks:0,regs:0};
    setChannels([newChannel,...channels]);
    setForm({...form,campaign:'',content:'',term:''});
  };
  const copy=(text,id)=>{navigator.clipboard&&navigator.clipboard.writeText(text);setCopied(id);setTimeout(()=>setCopied(null),1500);};
  const remove=(id)=>setChannels(channels.filter(c=>c.id!==id));
  return <div style={{flex:1,overflow:'auto',padding:20,background:d.bg}}>

        {[
          {k:'url',l:'Целевой URL',ph:'https://dozim.ai/'},
          {k:'source',l:'utm_source *',ph:'yandex / telegram / email',select:Object.keys(SOURCE_LABELS)},
          {k:'medium',l:'utm_medium *',ph:'cpc / cpm / banner / email',select:['cpc','cpm','banner','email','social','referral','organic']},
          {k:'campaign',l:'utm_campaign *',ph:'spring_promo_2026'},
          {k:'content',l:'utm_content',ph:'banner_300x250'},
          {k:'term',l:'utm_term',ph:'купить кондиционер'},
        ].map(f=><div key={f.k} style={{marginBottom:10}}>
          <label style={{display:'block',fontSize:11,fontWeight:600,color:d.fg2,marginBottom:4}}>{f.l}</label>
          {f.select?
            <select value={form[f.k]} onChange={e=>setForm({...form,[f.k]:e.target.value})} style={{width:'100%',background:'rgba(255,255,255,0.04)',border:`1px solid ${d.bord}`,borderRadius:7,padding:'8px 10px',color:d.fg1,fontSize:12,outline:'none'}}>
              {f.select.map(o=><option key={o} value={o}>{o}</option>)}

            <input value={form[f.k]} onChange={e=>setForm({...form,[f.k]:e.target.value})} placeholder={f.ph} style={{width:'100%',background:'rgba(255,255,255,0.04)',border:`1px solid ${d.bord}`,borderRadius:7,padding:'8px 10px',color:d.fg1,fontSize:12,outline:'none'}}/>

function PayrollCalculator({employees,dark}){
  const d=dk(dark);
  const payroll=employees.filter(e=>e.status!=='blocked').map((emp,i)=>{
    const rule=SALARY_RULES[emp.role]||SALARY_RULES.viewer;
    const hours=emp.role==='owner'?0:Math.max(0,150-i*6);
    const kpi=emp.status==='active'?rule.bonus:0;
    const variable=rule.hour?Math.round(hours*rule.hour*0.35):0;
    const total=rule.base+variable+kpi;
    return {...emp,rule,hours,kpi,variable,total};
  });
  const monthTotal=payroll.reduce((s,e)=>s+e.total,0);
  const activeCount=payroll.filter(e=>e.role!=='owner').length;
  return <div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:14}}>
      <Card dark={dark} style={{padding:'14px 16px'}}>
        <div style={{fontSize:10,fontWeight:700,color:d.fg3,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Фонд оплаты</div>
        <div style={{fontSize:20,fontWeight:800,color:d.fg1}}>{monthTotal.toLocaleString('ru-RU')} ₽</div>
      </Card>
      <Card dark={dark} style={{padding:'14px 16px'}}>
        <div style={{fontSize:10,fontWeight:700,color:d.fg3,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Сотрудников в расчете</div>
        <div style={{fontSize:20,fontWeight:800,color:G}}>{activeCount}</div>
      </Card>
      <Card dark={dark} style={{padding:'14px 16px'}}>
        <div style={{fontSize:10,fontWeight:700,color:d.fg3,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Доступ</div>
        <div style={{fontSize:13,fontWeight:800,color:'#F59E0B',marginTop:4}}>Только руководитель</div>
      </Card>
    </div>
    <Card dark={dark} style={{overflow:'hidden',marginBottom:14}}>
      <div style={{padding:'14px 18px',borderBottom:`1px solid ${d.bord}`}}>
        <div style={{fontSize:14,fontWeight:800,color:d.fg1}}>Расчет зарплаты за месяц</div>
        <div style={{fontSize:11,color:d.fg3,marginTop:3}}>Оклад + часы/переменная часть + KPI-бонус. В проде доступ проверяется по роли owner.</div>
      </div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead>
            <tr style={{background:'rgba(255,255,255,0.03)',color:d.fg3,textAlign:'left'}}>
              <th style={{padding:'10px 14px',fontWeight:600}}>Сотрудник</th>
              <th style={{padding:'10px 14px',fontWeight:600}}>Роль</th>
              <th style={{padding:'10px 14px',fontWeight:600,textAlign:'right'}}>Оклад</th>
              <th style={{padding:'10px 14px',fontWeight:600,textAlign:'right'}}>Часы</th>
              <th style={{padding:'10px 14px',fontWeight:600,textAlign:'right'}}>Переменная</th>
              <th style={{padding:'10px 14px',fontWeight:600,textAlign:'right'}}>KPI</th>
              <th style={{padding:'10px 14px',fontWeight:600,textAlign:'right'}}>К выплате</th>
            </tr>
          </thead>
          <tbody>
            {payroll.map(emp=>{
              const r=ROLES[emp.role]||ROLES.viewer;
              return <tr key={emp.id} style={{borderTop:`1px solid ${d.bord}`}}>
                <td style={{padding:'11px 14px'}}><div style={{fontWeight:700,color:d.fg1}}>{emp.name||emp.email}</div><div style={{fontSize:11,color:d.fg3}}>{emp.position}</div></td>
                <td style={{padding:'11px 14px'}}><span style={{fontSize:10,fontWeight:800,color:r.color,background:r.color+'18',padding:'4px 8px',borderRadius:9999}}>{r.label}</span></td>
                <td style={{padding:'11px 14px',textAlign:'right',color:d.fg2}}>{emp.rule.base.toLocaleString('ru-RU')} ₽</td>
                <td style={{padding:'11px 14px',textAlign:'right',color:d.fg2}}>{emp.hours}</td>
                <td style={{padding:'11px 14px',textAlign:'right',color:d.fg2}}>{emp.variable.toLocaleString('ru-RU')} ₽</td>
                <td style={{padding:'11px 14px',textAlign:'right',color:d.fg2}}>{emp.kpi.toLocaleString('ru-RU')} ₽</td>
                <td style={{padding:'11px 14px',textAlign:'right',fontWeight:800,color:d.fg1}}>{emp.total.toLocaleString('ru-RU')} ₽</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </Card>
    <Card dark={dark} style={{padding:18}}>
      <div style={{fontSize:14,fontWeight:800,color:d.fg1,marginBottom:8}}>Как это будет работать</div>
      <div style={{fontSize:12,color:d.fg2,lineHeight:1.7}}>Руководитель задает оклад, ставку, KPI и премии по роли или конкретному сотруднику. Система подтягивает часы из задач/тайм-трекинга, закрытые KPI из CRM и формирует ведомость. Финансист видит итог после подтверждения руководителем, но не может менять правила.</div>
    </Card>
  </div>;
}

function AdminEmployees({dark}){
  const d=dk(dark);
  const [tab,setTab]=React.useState('list');
  const [employees,setEmployees]=React.useState(INIT_EMPLOYEES);
  const [tasks,setTasks]=React.useState(INIT_TASKS);
  const [showInvite,setShowInvite]=React.useState(false);
  const [showTaskModal,setShowTaskModal]=React.useState(false);
  const [editingTask,setEditingTask]=React.useState(null);
  const [rolePerms,setRolePerms]=React.useState(ROLE_PERMS);
  const totalActive=employees.filter(e=>e.status==='active').length;
  const totalInvited=employees.filter(e=>e.status==='invited').length;
  const tasksOpen=tasks.filter(t=>t.status!=='done').length;
  const handleInvite=(data)=>{
    const id=Math.max(...employees.map(e=>e.id))+1;
    setEmployees([...employees,{id,...data,name:data.name||'',status:'invited',joinedAt:new Date().toISOString().slice(0,10),lastActive:'—',avatar:'#94A3B8'}]);
  };
  const updateEmployee=(id,patch)=>setEmployees(employees.map(e=>e.id===id?{...e,...patch}:e));
  const removeEmployee=(id)=>{if(confirm('Удалить сотрудника?'))setEmployees(employees.filter(e=>e.id!==id));};
  const saveTask=(data)=>{
    if(editingTask){setTasks(tasks.map(t=>t.id===editingTask.id?{...t,...data}:t));}
    else{const id=Math.max(0,...tasks.map(t=>t.id))+1;setTasks([...tasks,{id,...data,createdAt:new Date().toISOString().slice(0,10)}]);}
    setEditingTask(null);
  };
  const removeTask=(id)=>setTasks(tasks.filter(t=>t.id!==id));
  const moveTask=(id,status)=>setTasks(tasks.map(t=>t.id===id?{...t,status}:t));
  const togglePerm=(role,permId)=>{
    if(role==='owner')return;
    const cur=rolePerms[role]||[];
    setRolePerms({...rolePerms,[role]:cur.includes(permId)?cur.filter(p=>p!==permId):[...cur,permId]});
  };
  const canViewPayroll=employees.some(e=>e.email==='admin@dozim.ai'&&e.role==='owner'&&e.status==='active');
  const tabs=[{id:'list',l:'Список'},{id:'roles',l:'Роли и права'},{id:'tasks',l:'Задачи'},...(canViewPayroll?[{id:'payroll',l:'Зарплаты'}]:[])];
  return <div style={{flex:1,overflow:'auto',padding:20,background:d.bg}}>
    {showInvite&&<InviteModal onClose={()=>setShowInvite(false)} onInvite={handleInvite} dark={dark}/>}
    {showTaskModal&&<TaskModal onClose={()=>{setShowTaskModal(false);setEditingTask(null);}} onSave={saveTask} dark={dark} employees={employees} task={editingTask}/>}
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
      <div>
        <h1 style={{fontSize:22,fontWeight:800,color:d.fg1}}>Сотрудники</h1>
        <p style={{fontSize:12,color:d.fg2,marginTop:2}}>Команда, права доступа и задачи</p>
      </div>
      <div style={{display:'flex',gap:8}}>
        {tab==='tasks'&&<Btn size="sm" variant="secondary" onClick={()=>{setEditingTask(null);setShowTaskModal(true);}}><Ico size={12} color={T.darkFg1}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Ico>Новая задача</Btn>}
        <Btn size="sm" onClick={()=>setShowInvite(true)}><Ico size={12} color="#fff"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Ico>Пригласить сотрудника</Btn>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:14}}>
      <Card dark={dark} style={{padding:'14px 16px'}}>
        <div style={{fontSize:10,fontWeight:600,color:d.fg3,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Активных сотрудников</div>
        <div style={{fontSize:20,fontWeight:800,color:d.fg1}}>{totalActive}</div>
      </Card>
      <Card dark={dark} style={{padding:'14px 16px'}}>
        <div style={{fontSize:10,fontWeight:600,color:d.fg3,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Ожидают принятия</div>
        <div style={{fontSize:20,fontWeight:800,color:'#F59E0B'}}>{totalInvited}</div>
      </Card>
      <Card dark={dark} style={{padding:'14px 16px'}}>
        <div style={{fontSize:10,fontWeight:600,color:d.fg3,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Открытых задач</div>
        <div style={{fontSize:20,fontWeight:800,color:G}}>{tasksOpen}</div>
      </Card>
    </div>
    <div style={{display:'flex',gap:4,padding:3,background:'rgba(255,255,255,0.04)',borderRadius:9,marginBottom:14,maxWidth:520}}>
      {tabs.map(t=>
        <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'8px 12px',border:'none',borderRadius:7,background:tab===t.id?G:'transparent',color:tab===t.id?'#fff':d.fg2,fontFamily:'inherit',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all 150ms'}}>{t.l}</button>
      )}
    </div>
    {tab==='list'&&<Card dark={dark} style={{overflow:'hidden'}}>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead>
            <tr style={{background:'rgba(255,255,255,0.03)',color:d.fg3,textAlign:'left'}}>
              <th style={{padding:'12px 14px',fontWeight:600}}>Сотрудник</th>
              <th style={{padding:'12px 14px',fontWeight:600}}>Должность</th>
              <th style={{padding:'12px 14px',fontWeight:600}}>Роль</th>
              <th style={{padding:'12px 14px',fontWeight:600}}>Статус</th>
              <th style={{padding:'12px 14px',fontWeight:600}}>Активность</th>
              <th style={{padding:'12px 14px',fontWeight:600,textAlign:'right'}}>Действия</th>
            </tr>
          </thead>
          <tbody>
            {employees.map(emp=>{
              const r=ROLES[emp.role]||ROLES.viewer;
              const sb=emp.status==='active'?{l:'Активен',c:G,bg:GL}:emp.status==='invited'?{l:'Приглашён',c:'#D97706',bg:'#FEF3C7'}:{l:'Заблокирован',c:T.redD,bg:T.redL};
              const initials=(emp.name||emp.email).split(/[ .@]/).filter(Boolean).slice(0,2).map(s=>s[0]||'').join('').toUpperCase()||'?';
              return <tr key={emp.id} style={{borderTop:`1px solid ${d.bord}`}}>
                <td style={{padding:'12px 14px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:32,height:32,borderRadius:'50%',background:emp.avatar,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>{initials}</div>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:600,color:d.fg1}}>{emp.name||<span style={{color:d.fg3,fontStyle:'italic',fontWeight:400}}>не принято</span>}</div>
                      <div style={{fontSize:11,color:d.fg3}}>{emp.email}</div>
                    </div>
                  </div>
                </td>
                <td style={{padding:'12px 14px',color:d.fg2}}>{emp.position}</td>
                <td style={{padding:'12px 14px'}}>
                  <select value={emp.role} onChange={e=>updateEmployee(emp.id,{role:e.target.value})} disabled={emp.role==='owner'} style={{background:'rgba(255,255,255,0.04)',border:`1px solid ${r.color}40`,borderRadius:6,padding:'4px 8px',color:r.color,fontSize:11,fontWeight:700,outline:'none',fontFamily:'inherit',cursor:emp.role==='owner'?'not-allowed':'pointer'}}>
                    {Object.keys(ROLES).map(role=><option key={role} value={role} style={{color:'#000'}}>{ROLES[role].label}</option>)}
                  </select>
                </td>
                <td style={{padding:'12px 14px'}}><span style={{fontSize:10,fontWeight:600,color:sb.c,background:sb.bg,padding:'3px 8px',borderRadius:9999}}>{sb.l}</span></td>
                <td style={{padding:'12px 14px',color:d.fg2,fontSize:11}}>{emp.lastActive}</td>
                <td style={{padding:'12px 14px',textAlign:'right',whiteSpace:'nowrap'}}>
                  {emp.status==='invited'&&<button title="Отправить повторно" style={{background:'transparent',border:`1px solid ${d.bord}`,borderRadius:6,padding:'4px 8px',cursor:'pointer',color:d.fg2,fontSize:11,fontFamily:'inherit',marginRight:4}}>↻ повтор</button>}
                  {emp.status==='active'&&emp.role!=='owner'&&<button onClick={()=>updateEmployee(emp.id,{status:'blocked'})} title="Заблокировать" style={{background:'transparent',border:`1px solid ${d.bord}`,borderRadius:6,padding:'4px 8px',cursor:'pointer',color:d.fg2,fontSize:11,fontFamily:'inherit',marginRight:4}}>🔒</button>}
                  {emp.status==='blocked'&&<button onClick={()=>updateEmployee(emp.id,{status:'active'})} title="Разблокировать" style={{background:'transparent',border:`1px solid ${d.bord}`,borderRadius:6,padding:'4px 8px',cursor:'pointer',color:G,fontSize:11,fontFamily:'inherit',marginRight:4}}>🔓</button>}
                  {emp.role!=='owner'&&<button onClick={()=>removeEmployee(emp.id)} title="Удалить" style={{background:'transparent',border:`1px solid ${d.bord}`,borderRadius:6,padding:'4px 8px',cursor:'pointer',color:T.redD,fontSize:13,fontFamily:'inherit'}}>×</button>}
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </Card>}
    {tab==='roles'&&<>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12,marginBottom:14}}>
        {Object.keys(ROLES).map(rk=>{
          const r=ROLES[rk];
          const count=employees.filter(e=>e.role===rk).length;
          return <Card key={rk} dark={dark} style={{padding:'14px 16px',borderLeft:`3px solid ${r.color}`}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
              <span style={{fontSize:13,fontWeight:700,color:r.color}}>{r.label}</span>
              <span style={{fontSize:11,color:d.fg3}}>{count} чел.</span>
            </div>
            <div style={{fontSize:11,color:d.fg2,lineHeight:1.5,marginBottom:8}}>{r.desc}</div>
            <div style={{fontSize:10,color:d.fg3}}>Прав: <strong style={{color:d.fg1}}>{(rolePerms[rk]||[]).length}</strong> из {PERMISSIONS.length}</div>
          </Card>;
        })}
      </div>
      <Card dark={dark} style={{overflow:'hidden'}}>
        <div style={{padding:'14px 18px',borderBottom:`1px solid ${d.bord}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:14,fontWeight:700,color:d.fg1}}>Матрица прав доступа</span>
          <span style={{fontSize:11,color:d.fg3}}>Кликните на ячейку, чтобы изменить</span>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'rgba(255,255,255,0.03)'}}>
                <th style={{padding:'10px 14px',textAlign:'left',fontWeight:600,color:d.fg3,minWidth:220}}>Право</th>
                {Object.keys(ROLES).map(rk=><th key={rk} style={{padding:'10px 8px',textAlign:'center',fontWeight:700,color:ROLES[rk].color,fontSize:11,letterSpacing:'0.04em'}}>{ROLES[rk].label}</th>)}
              </tr>
            </thead>
            <tbody>
              {Array.from(new Set(PERMISSIONS.map(p=>p.group))).map(group=><React.Fragment key={group}>
                <tr><td colSpan={Object.keys(ROLES).length+1} style={{padding:'8px 14px',background:'rgba(255,255,255,0.02)',fontSize:10,fontWeight:700,color:d.fg3,textTransform:'uppercase',letterSpacing:'0.06em'}}>{group}</td></tr>
                {PERMISSIONS.filter(p=>p.group===group).map(perm=>
                  <tr key={perm.id} style={{borderTop:`1px solid ${d.bord}`}}>
                    <td style={{padding:'10px 14px',color:d.fg1}}>{perm.label}</td>
                    {Object.keys(ROLES).map(rk=>{
                      const has=(rolePerms[rk]||[]).includes(perm.id);
                      const isOwner=rk==='owner';
                      return <td key={rk} style={{padding:'8px',textAlign:'center'}}>
                        <button onClick={()=>togglePerm(rk,perm.id)} disabled={isOwner} title={isOwner?'У владельца все права':''} style={{width:24,height:24,borderRadius:6,border:'none',background:has?ROLES[rk].color+'25':'transparent',color:has?ROLES[rk].color:d.fg3,cursor:isOwner?'not-allowed':'pointer',fontSize:14,fontWeight:700,fontFamily:'inherit',opacity:isOwner?0.6:1}}>{has?'✓':'·'}</button>
                      </td>;
                    })}
                  </tr>
                )}
              </React.Fragment>)}
            </tbody>
          </table>
        </div>
      </Card>
    </>}
    {tab==='tasks'&&<TaskBoard tasks={tasks} employees={employees} dark={dark} onMove={moveTask} onEdit={t=>{setEditingTask(t);setShowTaskModal(true);}} onRemove={removeTask}/>}
    {tab==='payroll'&&canViewPayroll&&<PayrollCalculator employees={employees} dark={dark}/>}
  </div>;
}

function TaskBoard({tasks,employees,dark,onMove,onEdit,onRemove}){
  const d=dk(dark);
  const cols=[
    {id:'todo',l:'К выполнению',c:'#94A3B8'},
    {id:'in_progress',l:'В работе',c:'#3B82F6'},
    {id:'done',l:'Готово',c:G},
  ];
  const prio={low:{l:'Низк.',c:'#94A3B8'},mid:{l:'Сред.',c:'#3B82F6'},high:{l:'Выс.',c:T.redD}};
  const today=new Date().toISOString().slice(0,10);
  const empById=Object.fromEntries(employees.map(e=>[e.id,e]));
  const nextStatus={todo:'in_progress',in_progress:'done',done:'todo'};
  return <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
    {cols.map(col=>{
      const colTasks=tasks.filter(t=>t.status===col.id);
      return <div key={col.id} style={{background:d.card,border:`1px solid ${d.bord}`,borderRadius:11,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'12px 14px',borderBottom:`1px solid ${d.bord}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:col.c}}/>
            <span style={{fontSize:12,fontWeight:700,color:d.fg1}}>{col.l}</span>
          </div>
          <span style={{fontSize:11,color:d.fg3,background:'rgba(255,255,255,0.05)',padding:'2px 8px',borderRadius:9999}}>{colTasks.length}</span>
        </div>
        <div style={{padding:8,minHeight:300,display:'flex',flexDirection:'column',gap:8}}>
          {colTasks.length===0&&<div style={{padding:'30px 12px',textAlign:'center',color:d.fg3,fontSize:11}}>Нет задач</div>}
          {colTasks.map(t=>{
            const emp=empById[t.assigneeId];
            const overdue=t.deadline<today&&t.status!=='done';
            const initials=emp?(emp.name||emp.email).split(/[ .@]/).filter(Boolean).slice(0,2).map(s=>s[0]||'').join('').toUpperCase():'?';
            return <div key={t.id} style={{background:'rgba(255,255,255,0.03)',border:`1px solid ${d.bord}`,borderLeft:`3px solid ${prio[t.priority].c}`,borderRadius:8,padding:'10px 12px',cursor:'pointer'}} onClick={()=>onEdit(t)}>
              <div style={{fontSize:12,fontWeight:600,color:d.fg1,lineHeight:1.4,marginBottom:8,textDecoration:t.status==='done'?'line-through':'none',opacity:t.status==='done'?0.7:1}}>{t.title}</div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6}}>
                <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0,flex:1}}>
                  {emp&&<div title={emp.name||emp.email} style={{width:22,height:22,borderRadius:'50%',background:emp.avatar,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,flexShrink:0}}>{initials}</div>}
                  <span style={{fontSize:10,color:d.fg3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{emp?(emp.name||emp.email.split('@')[0]):'—'}</span>
                </div>
                <span style={{fontSize:10,color:overdue?T.redD:d.fg3,fontWeight:overdue?700:400,whiteSpace:'nowrap'}}>{overdue?'⚠ ':''}{t.deadline.slice(5)}</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8,paddingTop:8,borderTop:`1px solid ${d.bord}`}}>
                <span style={{fontSize:9,fontWeight:700,color:prio[t.priority].c,letterSpacing:'0.06em'}}>● {prio[t.priority].l}</span>
                <div style={{display:'flex',gap:4}}>
                  <button onClick={e=>{e.stopPropagation();onMove(t.id,nextStatus[t.status]);}} title="Сменить статус" style={{background:'transparent',border:`1px solid ${d.bord}`,borderRadius:5,padding:'2px 6px',cursor:'pointer',color:d.fg2,fontSize:10,fontFamily:'inherit'}}>{t.status==='done'?'↺':'→'}</button>
                  <button onClick={e=>{e.stopPropagation();if(confirm('Удалить задачу?'))onRemove(t.id);}} style={{background:'transparent',border:`1px solid ${d.bord}`,borderRadius:5,padding:'2px 6px',cursor:'pointer',color:T.redD,fontSize:11,fontFamily:'inherit'}}>×</button>
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>;
    })}
  </div>;
}

function AdminApp({dark,user,onSignOut}){
  const d=dk(dark);
  const [page,setPage]=React.useState('dashboard');

// ═══════════════════════════════════════════════════════════════
// SUPABASE AUTH
// ═══════════════════════════════════════════════════════════════
// 👇 ВСТАВЬТЕ СЮДА ДАННЫЕ СВОЕГО SUPABASE-ПРОЕКТА
// Где взять: Supabase → ваш проект → Settings → API
// Если оставить пустыми — работает демо-режим (test@dozim.ai / password)
const SUPABASE_URL  = '';
const SUPABASE_ANON_KEY = '';

// Email-адреса, имеющие доступ к админке (#/admin).
// В реальном проекте лучше хранить роль в таблице profiles в Supabase.
const ADMIN_EMAILS = ['admin@dozim.ai'];

const supabase = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function useAuth(){
  const [user,setUser]=React.useState(null);
  const [loading,setLoading]=React.useState(true);
  React.useEffect(()=>{
    if(!supabase){
      // Демо-режим (если Supabase не настроен)
      try{const s=sessionStorage.getItem('dozim_demo_user');if(s)setUser(JSON.parse(s));}catch(e){}
      setLoading(false);
      return;
    }
    supabase.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user||null);
      setLoading(false);
    });
    const {data:{subscription}}=supabase.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user||null);
    });
    return ()=>subscription.unsubscribe();
  },[]);
  const signOut=async()=>{
    if(supabase){await supabase.auth.signOut();}
    else{try{sessionStorage.removeItem('dozim_demo_user');}catch(e){} setUser(null);}
  };
  return {user,loading,signOut,setUser};
}

function LoginPage({dark,onDemoLogin}){
  const d=dk(dark);
  const [mode,setMode]=React.useState('signin');
  const [email,setEmail]=React.useState('');
  const [password,setPassword]=React.useState('');
  const [err,setErr]=React.useState('');
  const [info,setInfo]=React.useState('');
  const [busy,setBusy]=React.useState(false);
  const submit=async(e)=>{
    e&&e.preventDefault();
    setErr('');setInfo('');setBusy(true);
    try{
      if(!email||!password){throw new Error('Заполните email и пароль');}
      if(!supabase){
        // Демо-режим
        if(email==='test@dozim.ai'&&password==='password'){
          const u={id:'demo-user',email,user_metadata:{name:'Демо-пользователь'}};
          try{sessionStorage.setItem('dozim_demo_user',JSON.stringify(u));}catch(e){}
          onDemoLogin(u);
        }else if(email==='admin@dozim.ai'&&password==='password'){
          const u={id:'demo-admin',email,user_metadata:{name:'Администратор'}};
          try{sessionStorage.setItem('dozim_demo_user',JSON.stringify(u));}catch(e){}
          onDemoLogin(u);
        }else{
          throw new Error('Demo: test@dozim.ai / password (или admin@dozim.ai)');
        }
      }else{
        if(mode==='signin'){
          const {error}=await supabase.auth.signInWithPassword({email,password});
          if(error)throw error;
        }else{
          const {error}=await supabase.auth.signUp({email,password});
          if(error)throw error;
          setInfo('Письмо для подтверждения отправлено на '+email);
        }
      }
    }catch(ex){setErr(ex.message||String(ex));}finally{setBusy(false);}
  };
  return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:d.bg,padding:20}}>
    <div style={{width:'100%',maxWidth:420}}>
      <div style={{textAlign:'center',marginBottom:24}}>
        <img src="/brand/dozim-logo-16-9.png" alt="ДОЖИМ-АЙ" style={{width:220,height:'auto',display:'inline-block',marginBottom:6}}/>
        <div style={{fontSize:12,color:d.fg2}}>AI-ассистент для рекламы</div>
      </div>
      <Card dark={dark} style={{padding:28}}>
        <div style={{display:'flex',gap:4,padding:3,background:'rgba(255,255,255,0.04)',borderRadius:9,marginBottom:20}}>
          {[{id:'signin',l:'Вход'},{id:'signup',l:'Регистрация'}].map(t=>
            <button key={t.id} onClick={()=>{setMode(t.id);setErr('');setInfo('');}} style={{flex:1,padding:'8px 12px',border:'none',borderRadius:7,background:mode===t.id?G:'transparent',color:mode===t.id?'#fff':d.fg2,fontFamily:'inherit',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all 150ms'}}>{t.l}</button>
          )}
        </div>
        <form onSubmit={submit}>
          <label style={{display:'block',fontSize:11,fontWeight:600,color:d.fg2,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.06em'}}>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" autoComplete="email" style={{width:'100%',background:'rgba(255,255,255,0.04)',border:`1px solid ${d.bord}`,borderRadius:8,padding:'10px 12px',color:d.fg1,fontSize:13,outline:'none',marginBottom:14}}/>
          <label style={{display:'block',fontSize:11,fontWeight:600,color:d.fg2,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.06em'}}>Пароль</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" autoComplete={mode==='signin'?'current-password':'new-password'} style={{width:'100%',background:'rgba(255,255,255,0.04)',border:`1px solid ${d.bord}`,borderRadius:8,padding:'10px 12px',color:d.fg1,fontSize:13,outline:'none',marginBottom:16}}/>
          {err&&<div style={{padding:'10px 12px',background:T.redL,border:`1px solid ${T.red}`,borderRadius:8,color:T.redD,fontSize:12,marginBottom:14}}>⚠ {err}</div>}
          {info&&<div style={{padding:'10px 12px',background:GL,border:`1px solid ${G}`,borderRadius:8,color:GD,fontSize:12,marginBottom:14}}>✓ {info}</div>}
          <Btn full size="lg" onClick={submit} disabled={busy}>{busy?'Подождите...':(mode==='signin'?'Войти':'Создать аккаунт')}</Btn>
        </form>
        {!supabase&&<div style={{marginTop:18,padding:'12px 14px',background:'rgba(251,191,36,0.08)',border:'1px solid rgba(251,191,36,0.25)',borderRadius:8,fontSize:11,color:d.fg2,lineHeight:1.5}}>
          <strong style={{color:'#FBBF24'}}>Демо-режим</strong> — Supabase не настроен. Войдите тестовыми данными:<br/>
          <code style={{color:d.fg1}}>test@dozim.ai</code> / <code style={{color:d.fg1}}>password</code> — обычный пользователь<br/>
          <code style={{color:d.fg1}}>admin@dozim.ai</code> / <code style={{color:d.fg1}}>password</code> — админ
        </div>}
        {supabase&&mode==='signin'&&<div style={{marginTop:14,textAlign:'center'}}>
          <button type="button" onClick={async()=>{
            if(!email){setErr('Введите email для восстановления пароля');return;}
            try{await supabase.auth.resetPasswordForEmail(email);setInfo('Ссылка для сброса пароля отправлена на '+email);}catch(e){setErr(e.message);}
          }} style={{background:'none',border:'none',color:d.fg3,fontFamily:'inherit',fontSize:12,cursor:'pointer',textDecoration:'underline'}}>Забыли пароль?</button>
        </div>}
      </Card>
      <div style={{textAlign:'center',marginTop:16,fontSize:11,color:d.fg3}}>© 2026 ДОЖИМ-АЙ</div>
    </div>
  </div>;
}

// ── APP ───────────────────────────────────────────────────────
function App(){
  const {user,loading,signOut,setUser}=useAuth();
  const [active,setActive]=React.useState('home');
  const [dark,setDark]=React.useState(true);
  const [plan,setPlan]=React.useState('free');
  const [showCal,setShowCal]=React.useState(false);
  const [scrollProblems,setScrollProblems]=React.useState(0);
  const [route,setRoute]=React.useState(location.hash);
  React.useEffect(()=>{
    const onHash=()=>setRoute(location.hash);
    window.addEventListener('hashchange',onHash);
    return ()=>window.removeEventListener('hashchange',onHash);
  },[]);
  const d=dk(dark);

  if(loading){
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:d.bg}}>
      <div style={{color:d.fg2,fontSize:13}}>Загрузка...</div>
    </div>;
  }

  if(!user){
    return <LoginPage dark={dark} onDemoLogin={(u)=>setUser(u)}/>;
  }

  const isAdmin=ADMIN_EMAILS.includes(user.email);

  // Админ-маршрут
  if(route.startsWith('#/admin')){
    if(!isAdmin){
      return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:d.bg,padding:20}}>
        <Card dark={dark} style={{padding:32,maxWidth:420,textAlign:'center'}}>
          <div style={{fontSize:48,marginBottom:12}}>🔒</div>
          <div style={{fontSize:18,fontWeight:700,color:d.fg1,marginBottom:8}}>Нет доступа</div>
          <div style={{fontSize:13,color:d.fg2,marginBottom:20}}>Раздел «Админ-панель» доступен только администраторам. Вы вошли как <strong style={{color:d.fg1}}>{user.email}</strong>.</div>
          <Btn full onClick={()=>{location.hash='';}}>Вернуться в кабинет</Btn>
          <button onClick={signOut} style={{marginTop:10,background:'none',border:'none',color:d.fg3,fontFamily:'inherit',fontSize:12,cursor:'pointer',textDecoration:'underline'}}>Выйти и войти под другим аккаунтом</button>
        </Card>
      </div>;
    }
    return <AdminApp dark={dark} user={user} onSignOut={signOut}/>;
  }

  const nav=p=>setActive(p);
  const handleNotif=()=>{setActive('home');setScrollProblems(n=>n+1);};
  const pageMap={
    home:<HomePage dark={dark} scrollToProblems={scrollProblems}/>,
    analyst:<AnalystPage dark={dark}/>,
    yandex:<YandexPage dark={dark} plan={plan}/>,
    campaigns:<CampaignsPage dark={dark}/>,
    analytics:<AnalyticsPage dark={dark}/>,
    opps:<OppsPage dark={dark}/>,
    history:<HistoryPage dark={dark}/>,
    settings:<SettingsPage dark={dark} onDark={setDark} plan={plan} onPlan={setPlan}/>,
    help:<HelpPage dark={dark}/>,
  };
  return <div style={{display:'flex',height:'100vh',overflow:'hidden',background:d.bg}}>
    {showCal&&<CalendarModal onClose={()=>setShowCal(false)} dark={dark}/>}
    <Sidebar active={active} onNav={nav} dark={dark} plan={plan} user={user} onSignOut={signOut} isAdmin={isAdmin}/>
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <TopBar dark={dark} onCalendar={()=>setShowCal(true)} onNotif={handleNotif}/>
      {pageMap[active]||<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:d.fg3}}>Раздел в разработке</div>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
