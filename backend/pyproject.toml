[project]
name = "saas-direct-ai"
version = "0.1.0"
description = "AI constructor + analyst for Yandex Direct (MVP, Excel-based)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.12",
  "httpx>=0.27.2",
  "openai>=1.47.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.1",
  "celery>=5.4.0",
  "redis>=5.0.8",
  "slowapi>=0.1.9",
  "bleach>=6.1.0",
  "cryptography>=43.0.1",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "python-dotenv>=1.0.1",
  "supabase>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.8",
  "mypy>=1.11.2",
  "httpx>=0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
