user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 12M;                 # matches MAX_UPLOAD_SIZE_MB + headroom
    client_body_timeout  60s;
    client_header_timeout 30s;
    send_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain text/css application/json application/javascript
        application/xml text/xml application/rss+xml image/svg+xml
        font/ttf font/woff font/woff2;

    log_format combined_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"bytes":$bytes_sent,'
        '"referer":"$http_referer","ua":"$http_user_agent",'
        '"rt":$request_time,"uct":"$upstream_connect_time",'
        '"urt":"$upstream_response_time"}';
    access_log /var/log/nginx/access.log combined_json;
    error_log  /var/log/nginx/error.log warn;

    # Rate limits (SlowAPI covers app-level; these are edge-level safety nets)
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=upload:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=connlim:10m;

    # Resolvers for Let's Encrypt
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 10s;

    include /etc/nginx/conf.d/*.conf;
}
